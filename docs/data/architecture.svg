<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-label="Архитектура Системы планирования доставки" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9e9e9e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="660" rx="8" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Архитектура Системы: контур расчёта запускается оркестратором</text>

  <!-- Контур расчёта -->
  <rect x="24" y="215" width="712" height="225" rx="16" fill="#f2f2f2" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Связи -->
  <g fill="none" stroke="#9e9e9e" stroke-width="1.25">
    <path d="M290 80H125V141" marker-end="url(#arch-arrow)"/>
    <path d="M460 80H625V141" marker-end="url(#arch-arrow)"/>
    <path d="M125 189V215" marker-end="url(#arch-arrow)"/>
    <path d="M625 189V215" marker-end="url(#arch-arrow)"/>
    <path d="M210 320H290" marker-end="url(#arch-arrow)"/>
    <path d="M460 320H500V476" marker-end="url(#arch-arrow)"/>
    <path d="M585 500H625V344" marker-end="url(#arch-arrow)"/>
    <path d="M625 296V262H125V296" marker-end="url(#arch-arrow)"/>
    <path d="M125 344V502" marker-end="url(#arch-arrow)"/>
    <path d="M315 610H125V572" marker-end="url(#arch-arrow)"/>
    <path d="M375 344V380" stroke-dasharray="4 3"/>
  </g>

  <!-- Компоненты -->
  <g fill="#ffffff" stroke="#9e9e9e" stroke-width="1.25">
    <rect x="290" y="56" width="170" height="48" rx="8"/>
    <rect x="40" y="141" width="170" height="48" rx="8"/>
    <rect x="540" y="141" width="170" height="48" rx="8"/>
    <rect x="40" y="296" width="170" height="48" rx="8"/>
    <rect x="290" y="296" width="170" height="48" rx="8"/>
    <rect x="540" y="296" width="170" height="48" rx="8"/>
    <rect x="305" y="380" width="140" height="40" rx="8"/>
    <rect x="315" y="586" width="170" height="48" rx="8"/>
  </g>
  <rect x="415" y="476" width="170" height="48" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>

  <!-- Хранилище -->
  <path d="M95 512V560A30 8 0 0 0 155 560V512" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.25"/>
  <ellipse cx="125" cy="512" rx="30" ry="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.25"/>

  <g font-weight="600" fill="#1f1f1f" text-anchor="middle">
    <text x="375" y="84">Frontend</text>
    <text x="125" y="169">Data Observing Layer</text>
    <text x="625" y="169">Orchestrator</text>
    <text x="125" y="324">Integration Layer</text>
    <text x="375" y="324">Domain Mapping Layer</text>
    <text x="625" y="324">Post-Processing Module</text>
    <text x="500" y="504">Algorithm Module</text>
    <text x="400" y="614">Input Load Module</text>
  </g>
  <text x="375" y="404" text-anchor="middle" fill="#1f1f1f">Tariffication</text>
  <text x="85" y="540" text-anchor="end" fill="#1f1f1f">Хранилище</text>

  <!-- Подписи связей -->
  <g font-size="11.5" fill="#616161">
    <text x="280" y="72" text-anchor="end">форматированные объекты</text>
    <text x="542" y="72" text-anchor="middle">запуск модулей</text>
    <text x="633" y="207">запуск</text>
    <text x="250" y="311" text-anchor="middle">данные БД</text>
    <text x="375" y="254" text-anchor="middle">результаты</text>
    <text x="508" y="405">доменные объекты</text>
    <text x="633" y="470">PlanningResult</text>
    <text x="133" y="475">запрос данных</text>
    <text x="220" y="600" text-anchor="middle">преобразование данных</text>
  </g>
</svg>
